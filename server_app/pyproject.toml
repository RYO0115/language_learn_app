# 言語学習単語帳アプリ プロジェクト設定
[project]
name = "language-learn-app"
version = "0.2.7"
description = "外国語学習単語帳アプリ（日本語話者向け英語学習）"
requires-python = ">=3.12"
dependencies = [
    "fastapi[standard]>=0.115.0",
    "sqlalchemy>=2.0.0",
    "anthropic>=0.40.0",
    "google-genai>=1.0.0",
    "jinja2>=3.1.0",
    "python-multipart>=0.0.12",
    "python-dotenv>=1.0.0",
    "pydantic-settings>=2.6.0",
    "aiofiles>=24.1.0",
    "pyspellchecker>=0.9.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "httpx>=0.28.0",
    "bump-my-version>=0.32.0",
    "pytest-playwright>=0.5.0",
]

[tool.bumpversion]
current_version = "0.2.7"
commit = true
tag = false
tag_name = "v{new_version}"

[[tool.bumpversion.files]]
filename = "pyproject.toml"
search = 'version = "{current_version}"'
replace = 'version = "{new_version}"'

[project.scripts]
start = "language_learn.main:main"

[tool.uv]
package = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/language_learn"]
