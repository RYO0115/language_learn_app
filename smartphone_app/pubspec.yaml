name: language_learn_app
description: 英語学習単語帳アプリ
version: 1.0.0+1
publish_to: none

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # ローカル DB
  drift: ^2.18.0
  sqlite3_flutter_libs: ^0.5.0

  # 状態管理
  flutter_riverpod: ^2.5.0
  riverpod_annotation: ^2.3.0

  # 安全なストレージ（API キー保存）
  flutter_secure_storage: ^9.0.0

  # HTTP クライアント
  dio: ^5.5.0

  # ナビゲーション
  go_router: ^14.0.0

  # エクスポート共有
  share_plus: ^10.0.0
  path_provider: ^2.1.0
  path: ^1.9.0

  # ファイル選択
  file_picker: ^8.0.0

  # URL をブラウザで開く
  url_launcher: ^6.3.0

  # 音声読み上げ
  flutter_tts: ^4.0.0

  # 多言語
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.2

  # 将来（広告）
  # google_mobile_ads: ^5.0.0

  # 将来（バックアップ）
  # icloud_storage: ^3.0.0
  # googleapis: ^13.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  drift_dev: ^2.18.0
  build_runner: ^2.4.0
  riverpod_generator: ^2.4.0
  mocktail: ^1.0.0
  integration_test:
    sdk: flutter

flutter:
  generate: true
  uses-material-design: true
