<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}単語帳アプリ{% endblock %}</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- HTMX -->
  <script src="https://unpkg.com/htmx.org@1.9.12"></script>
  <!-- Alpine.js -->
  <script defer src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js"></script>
  <!-- カスタム CSS -->
  <link rel="stylesheet" href="/static/css/app.css">

  <!-- 発音機能（Web Speech API）
       音声選択の優先順位:
         US: Google US English → Samantha → Karen → Victoria
         UK: Google UK English Female → Daniel → Google UK English Male -->
  <script>
    (function () {
      // ── ロケール設定 ─────────────────────────────────────────────────────────
      // localStorage でページをまたいで設定を保持する（デフォルト: en-US）
      var _locale = localStorage.getItem("tts-locale") || "en-US";

      // ロケールごとの優先音声名リスト
      var VOICE_PREFS = {
        "en-US": ["Google US English", "Samantha", "Karen", "Victoria", "Moira"],
        "en-GB": ["Google UK English Female", "Daniel", "Google UK English Male"],
      };

      // ── 音声リスト ────────────────────────────────────────────────────────────
      var _ttsVoices = [];

      function _loadVoices() {
        if (!window.speechSynthesis) return;
        _ttsVoices = speechSynthesis.getVoices();
      }
      _loadVoices();
      if (window.speechSynthesis) {
        speechSynthesis.onvoiceschanged = _loadVoices;
      }

      // ── 音声選択 ──────────────────────────────────────────────────────────────
      function _selectVoice(voices) {
        var preferred = VOICE_PREFS[_locale] || VOICE_PREFS["en-US"];
        // 優先名リストから順に検索
        for (var i = 0; i < preferred.length; i++) {
          for (var j = 0; j < voices.length; j++) {
            if (voices[j].name === preferred[i]) return voices[j];
          }
        }
        // フォールバック: 選択中ロケールに合う音声
        for (var i = 0; i < voices.length; i++) {
          if (voices[i].lang === _locale) return voices[i];
        }
        // フォールバック: 英語系の任意の音声
        for (var i = 0; i < voices.length; i++) {
          if (voices[i].lang.indexOf("en") === 0) return voices[i];
        }
        return null;
      }

      // ── 発話実行 ──────────────────────────────────────────────────────────────
      function _doSpeak(text, rate) {
        var u = new SpeechSynthesisUtterance(text);
        u.lang = _locale;   // 選択中のロケールで発話
        u.rate = rate;
        u.pitch = 1.0;
        var voices = _ttsVoices.length > 0 ? _ttsVoices : speechSynthesis.getVoices();
        var voice = _selectVoice(voices);
        if (voice) u.voice = voice;
        speechSynthesis.speak(u);
      }

      /**
       * 英語テキストを音声で読み上げるグローバル関数。
       * Chrome バグ対策: speaking 中のみ cancel() + 200ms 待機。
       */
      window.pronounce = function (text, rate) {
        rate = rate || 1.0;
        if (!window.speechSynthesis) {
          alert("お使いのブラウザは音声読み上げに対応していません。");
          return;
        }
        if (speechSynthesis.speaking) {
          speechSynthesis.cancel();
          setTimeout(function () { _doSpeak(text, rate); }, 200);
        } else {
          _doSpeak(text, rate);
        }
      };

      // ── US / UK トグル ────────────────────────────────────────────────────────

      // トグルボタンの表示を現在のロケールに合わせて更新する
      function _updateToggleBtn() {
        var btn = document.getElementById("locale-toggle-btn");
        if (!btn) return;
        if (_locale === "en-US") {
          btn.textContent = "🇺🇸 US";
          btn.title = "クリックしてイギリス英語（UK）に切り替え";
        } else {
          btn.textContent = "🇬🇧 UK";
          btn.title = "クリックしてアメリカ英語（US）に切り替え";
        }
      }

      /** US / UK を切り替えてボタン表示を更新するグローバル関数 */
      window.toggleLocale = function () {
        _locale = _locale === "en-US" ? "en-GB" : "en-US";
        localStorage.setItem("tts-locale", _locale);
        _updateToggleBtn();
      };

      // DOM 構築後にボタン表示を初期化する
      document.addEventListener("DOMContentLoaded", _updateToggleBtn);
    })();
  </script>
</head>
<body class="bg-gray-50 min-h-screen" hx-boost="false">

  <!-- ナビゲーションバー -->
  <nav class="bg-blue-600 text-white shadow-md">
    <div class="max-w-5xl mx-auto px-4 py-3 flex items-center justify-between">
      <a href="/" class="text-xl font-bold tracking-tight hover:opacity-80">
        📚 単語帳アプリ
      </a>
      <div class="flex items-center gap-2 text-sm font-medium">
        <!-- ダッシュボード -->
        <a href="/" class="px-4 py-2 rounded-lg border border-blue-400 hover:bg-white hover:text-blue-700 transition-colors duration-150">ダッシュボード</a>

        <!-- US / UK 発音切り替えボタン（ダッシュボードの横） -->
        <button id="locale-toggle-btn"
                onclick="toggleLocale()"
                class="px-3 py-2 rounded-lg bg-blue-800 hover:bg-blue-700 border border-blue-500 text-white text-xs font-bold tracking-wide transition-colors duration-150"
                title="発音アクセントを切り替え">
          🇺🇸 US
        </button>

        <!-- 区切り線 -->
        <div class="w-px h-5 bg-blue-400 opacity-50 mx-1"></div>

        <a href="/words" class="px-4 py-2 rounded-lg border border-blue-400 hover:bg-white hover:text-blue-700 transition-colors duration-150">単語帳</a>
        <a href="/quiz" class="px-4 py-2 rounded-lg border border-blue-400 hover:bg-white hover:text-blue-700 transition-colors duration-150">テスト</a>
        <a href="/streak" class="px-4 py-2 rounded-lg border border-blue-400 hover:bg-white hover:text-blue-700 transition-colors duration-150">実績</a>
        <a href="/export" class="px-4 py-2 rounded-lg border border-blue-400 hover:bg-white hover:text-blue-700 transition-colors duration-150">インポート/エクスポート</a>
      </div>
    </div>
  </nav>

  <!-- メインコンテンツ -->
  <main class="max-w-5xl mx-auto px-4 py-8">
    {% block content %}{% endblock %}
  </main>

  <!-- フッター -->
  <footer class="text-center text-gray-400 text-xs py-6 mt-12">
    Language Learn App &copy; 2025
  </footer>

  <script src="/static/js/app.js"></script>
</body>
</html>
