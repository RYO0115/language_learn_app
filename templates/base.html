<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}単語帳アプリ{% endblock %}</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- HTMX -->
  <script src="https://unpkg.com/htmx.org@1.9.12"></script>
  <!-- Alpine.js -->
  <script defer src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js"></script>
  <!-- カスタム CSS -->
  <link rel="stylesheet" href="/static/css/app.css">

  <!-- 発音機能（Web Speech API）
       外部ファイルへの依存を避けてグローバルスコープに確実に定義する。

       音声選択の優先順位:
         1. Google US English  — Chrome のネットワーク音声（高品質）
         2. Samantha           — Safari / macOS 標準の高品質女性音声
         3. Karen / Victoria   — macOS 代替音声
         以降は en-US、en-* の順にフォールバック -->
  <script>
    (function () {
      var _ttsVoices = [];

      // 音声リストを初期化する。Chrome は onvoiceschanged で非同期に追加される。
      function _loadVoices() {
        if (!window.speechSynthesis) return;
        _ttsVoices = speechSynthesis.getVoices();
      }
      _loadVoices();
      if (window.speechSynthesis) {
        speechSynthesis.onvoiceschanged = _loadVoices;
      }

      // 優先音声名リスト
      // Chrome: "Google US English" が高品質ネットワーク音声
      // Safari/macOS: "Samantha" が標準の高品質女性音声
      var PREFERRED_VOICE_NAMES = [
        "Google US English",
        "Samantha",
        "Karen",
        "Victoria",
        "Moira",
      ];

      function _selectVoice(voices) {
        for (var i = 0; i < PREFERRED_VOICE_NAMES.length; i++) {
          for (var j = 0; j < voices.length; j++) {
            if (voices[j].name === PREFERRED_VOICE_NAMES[i]) return voices[j];
          }
        }
        for (var i = 0; i < voices.length; i++) {
          if (voices[i].lang === "en-US") return voices[i];
        }
        for (var i = 0; i < voices.length; i++) {
          if (voices[i].lang.indexOf("en") === 0) return voices[i];
        }
        return null;
      }

      function _doSpeak(text, rate) {
        var u = new SpeechSynthesisUtterance(text);
        u.lang = "en-US";
        u.rate = rate;
        u.pitch = 1.0;
        var voices = _ttsVoices.length > 0 ? _ttsVoices : speechSynthesis.getVoices();
        var voice = _selectVoice(voices);
        if (voice) u.voice = voice;
        speechSynthesis.speak(u);
      }

      /**
       * 英語テキストを音声で読み上げるグローバル関数。
       * ボタンの onclick から呼び出す: onclick="pronounce(this.dataset.word)"
       *
       * Chrome バグ対策: speaking 中のみ cancel() + 200ms 待機。
       * 再生中でなければ即座に speak() を呼ぶ。
       */
      window.pronounce = function (text, rate) {
        rate = rate || 1.0;
        if (!window.speechSynthesis) {
          alert("お使いのブラウザは音声読み上げに対応していません。");
          return;
        }
        if (speechSynthesis.speaking) {
          speechSynthesis.cancel();
          setTimeout(function () { _doSpeak(text, rate); }, 200);
        } else {
          _doSpeak(text, rate);
        }
      };
    })();
  </script>
</head>
<body class="bg-gray-50 min-h-screen" hx-boost="false">

  <!-- ナビゲーションバー -->
  <nav class="bg-blue-600 text-white shadow-md">
    <div class="max-w-5xl mx-auto px-4 py-3 flex items-center justify-between">
      <a href="/" class="text-xl font-bold tracking-tight hover:opacity-80">
        📚 単語帳アプリ
      </a>
      <div class="flex gap-3 text-sm font-medium">
        <a href="/" class="px-4 py-2 rounded-lg border border-blue-400 hover:bg-white hover:text-blue-700 transition-colors duration-150">ダッシュボード</a>
        <a href="/words" class="px-4 py-2 rounded-lg border border-blue-400 hover:bg-white hover:text-blue-700 transition-colors duration-150">単語帳</a>
        <a href="/quiz" class="px-4 py-2 rounded-lg border border-blue-400 hover:bg-white hover:text-blue-700 transition-colors duration-150">テスト</a>
        <a href="/streak" class="px-4 py-2 rounded-lg border border-blue-400 hover:bg-white hover:text-blue-700 transition-colors duration-150">実績</a>
        <a href="/export" class="px-4 py-2 rounded-lg border border-blue-400 hover:bg-white hover:text-blue-700 transition-colors duration-150">インポート/エクスポート</a>
      </div>
    </div>
  </nav>

  <!-- メインコンテンツ -->
  <main class="max-w-5xl mx-auto px-4 py-8">
    {% block content %}{% endblock %}
  </main>

  <!-- フッター -->
  <footer class="text-center text-gray-400 text-xs py-6 mt-12">
    Language Learn App &copy; 2025
  </footer>

  <script src="/static/js/app.js"></script>
</body>
</html>
